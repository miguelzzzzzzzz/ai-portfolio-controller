# Portfolio configuration: policies and the ordered project catalog.
# The catalog (ids and order) follows the owner's brief, section 5 (ADR-006).
# The planner refines each project's scope and milestones before it starts;
# changes are recorded in DECISIONS.md.

owner: miguelzzzzzzzz
workdir: /workspace/portfolio   # local checkouts live next to this repo

schedule:
  daily_cycle: "08:55 Asia/Manila"  # a Grok Bot routine runs the daily cycle every day

policies:
  max_active_projects: 1
  paid_api_budget_usd: 0          # no paid LLM/API spend without explicit user approval
  commit_style: conventional      # feat|fix|docs|test|eval|perf|refactor|ci|chore|build
  never_fabricate_metrics: true   # numbers only from executed, committed eval reports
  require_ci_green_before_next_milestone: true
  touch_only_portfolio_repos: true  # never modify pre-existing, unrelated repositories

quality:
  # Run by scripts/review_project.py --run-checks inside a project checkout.
  commands:
    - ruff check .
    - ruff format --check .
    - mypy
    - pytest -q -m "not slow"

# Each project has a stable `id` (the key in state.json and in script
# arguments), a GitHub `repo` slug, and a display `title` (ADR-014). Slugs are
# witty; repository descriptions and summaries stay plain.
projects:
  - id: production-rag-engine
    order: 1
    repo: CitationNeeded
    title: Citation Needed
    summary: >-
      Production-style RAG engine: structure-aware chunking, hybrid BM25 + vector
      retrieval, cross-encoder reranking, cited structured answers, FastAPI, and
      reproducible retrieval evals on SciFact.
    skills: [rag, embeddings, vector-search, bm25, reranking, evaluation, fastapi, docker, ci]
    milestones:
      - {id: M1, title: "Infrastructure, ingestion, configurable chunking"}
      - {id: M2, title: "Embeddings, vector store, BM25 index, retrieval interface"}
      - {id: M3, title: "Hybrid fusion, metadata filters, cross-encoder reranking"}
      - {id: M4, title: "Evaluation harness and benchmark reports"}
      - {id: M5, title: "Answer generation with citations and structured output"}
      - {id: M6, title: "FastAPI service, Dockerfile, image build in CI"}
      - {id: M7, title: "Hardening, documentation, v0.1.0 release"}

  - id: agentic-research-platform
    order: 2
    repo: RabbitHole
    title: Rabbit Hole
    summary: >-
      Hand-rolled tool-using research agent: planning, typed tool registry and
      routing, multi-step evidence gathering over the production-rag-engine
      retriever, budgets/timeouts/retries, guardrails, verified span citations,
      JSONL tracing, and programmatic trajectory evals with fault injection.
    skills: [agents, tool-calling, orchestration, guardrails, observability, evaluation, testing]
    staged_docs: /workspace/p02-agentic-research-platform  # repo created only after 01 completes
    milestones:
      - {id: M1, title: "Scaffold, tool contracts, registry, calculator, trace schema"}
      - {id: M2, title: "Agent loop, run state, budgets, timeouts/retries, scripted provider"}
      - {id: M3, title: "Research tools on the project-01 retriever, citations, guardrails"}
      - {id: M4, title: "Task suites, graders, eval runner, oracle and heuristic baselines"}
      - {id: M5, title: "OpenAI-compatible local-model provider, call parsing/repair, record/replay"}
      - {id: M6, title: "Fault injection, failure taxonomy, baselines and ablations"}
      - {id: M7, title: "Container, CI image smoke eval, docs, v0.1.0 release"}

  # Projects 03-10: ids, order, objectives, and capabilities come from the brief
  # (section 5). The planner turns them into milestones before each start
  # (done for 03).
  - id: llm-evaluation-lab
    order: 3
    repo: TrustIssues
    title: Trust Issues
    summary: >-
      Reusable evaluation framework for LLM applications: JSONL datasets, multiple
      models and prompts, deterministic evaluators plus model-based evaluators
      where appropriate, structured-output validation, hallucination checks,
      latency, token, and cost measurement, experiment comparison, regression
      detection, and HTML/Markdown reports.
    skills: [llm-evaluation, prompt-engineering, structured-outputs, hallucination-detection, cost-estimation, regression-testing, reporting]
    staged_docs: /workspace/p03-llm-evaluation-lab  # repo created only when 03 starts
    milestones:
      - {id: M1, title: "Scaffold, data model, dataset/prompt/experiment versioning"}
      - {id: M2, title: "Providers (scripted, replay, OpenAI-compatible streaming), response cache, matrix runner"}
      - {id: M3, title: "Grader plugin API and built-in graders, grader self-test"}
      - {id: M4, title: "Benchmark subsets (GSM8K, SQuAD 2.0) and hand-authored suites, oracle reports"}
      - {id: M5, title: "Statistics, compare, regression gate with injection tests, Markdown/HTML reports"}
      - {id: M6, title: "Live local-model matrix, latency and compute-cost measurement, price-table estimates, structured-output case study"}
      - {id: M7, title: "Optional LLM judge with measured human agreement"}
      - {id: M8, title: "Container, CI gate workflow for consumers, docs, v0.1.0 release"}

  - id: multimodal-document-intelligence
    order: 4
    repo: PaperTrail
    title: Paper Trail
    summary: >-
      Extracts structured information from complex documents (invoices, receipts,
      contracts, forms, financial statements, reports) through classification,
      OCR/vision extraction, structured extraction, validation, and confidence
      scoring into JSON. Pydantic schemas, malformed-document handling,
      validation rules, an evaluation dataset, extraction-accuracy metrics, and
      an API.
    skills: [document-intelligence, multimodal-ai, ocr, structured-outputs, pydantic, evaluation, fastapi]

  - id: mlops-fraud-detection
    order: 5
    repo: SusTransactions
    title: Sus Transactions
    summary: >-
      Conventional ML engineering and MLOps for fraud detection: dataset
      preparation, feature engineering, train/validation/test split, a baseline
      and an advanced model (XGBoost/LightGBM), experiment tracking, model
      versioning, API inference, Docker, CI, monitoring, and drift detection.
      Reports precision, recall, F1, PR-AUC, ROC-AUC, and inference latency,
      with the dataset and methodology documented honestly.
    skills: [machine-learning, feature-engineering, xgboost, lightgbm, experiment-tracking, model-versioning, drift-detection, mlops, docker, ci]

  - id: llm-finetuning-lab
    order: 6
    repo: LoraAndOrder
    title: "LoRA & Order"
    summary: >-
      Compares adaptation strategies: base model, prompt engineering, RAG,
      LoRA/QLoRA fine-tuning, and RAG plus fine-tuning. Documents the dataset,
      training procedure, hardware assumptions, model size, memory, training
      config, evaluation metrics, and limitations. Only fine-tuning that actually
      ran is reported; a smaller, executable experiment is used when hardware is
      constrained.
    skills: [fine-tuning, lora, qlora, rag, prompt-engineering, evaluation, deep-learning]

  - id: ai-observability-platform
    order: 7
    repo: WhoSpentMyTokens
    title: Who Spent My Tokens
    summary: >-
      Reusable observability components for LLM and agent applications. Tracks
      traces, model name, prompt version, tokens, latency, errors, retries, tool
      calls, estimated cost, eval results, and request metadata through
      OpenTelemetry, structured logging, metrics, dashboards, and experiment
      comparison.
    skills: [ai-observability, opentelemetry, structured-logging, tracing, metrics, dashboards, cost-tracking]

  - id: semantic-search-engine
    order: 8
    repo: HNSWFromScratch
    title: HNSW From Scratch
    summary: >-
      Production-style semantic search, built and benchmarked: embeddings, ANN
      search (HNSW), lexical and vector baselines, hybrid search, query
      expansion, reranking, and metadata filtering. Evaluates retrieval quality,
      indexing time, query latency, and memory usage.
    skills: [embeddings, ann-search, hnsw, hybrid-search, query-expansion, reranking, benchmarking]

  - id: voice-ai-agent
    order: 9
    repo: InterruptMe
    title: Interrupt Me
    summary: >-
      Interactive voice agent: audio, then STT, agent reasoning and tool
      calling, a response, and TTS. Focuses on streaming, interruption handling,
      response latency, session state, tool execution, and error recovery, and
      measures end-to-end latency.
    skills: [speech-to-text, text-to-speech, streaming, agents, tool-calling, latency-optimization]

  - id: ai-inference-benchmark
    order: 10
    repo: QuantLeap
    title: Quant Leap
    summary: >-
      Framework for benchmarking local or hosted inference across quantization,
      batching, model size, and concurrency. Measures time to first token,
      tokens/sec, memory, throughput, and total latency. Publishes only
      benchmarks that were actually executed; no fabricated GPU results.
    skills: [inference-optimization, quantization, batching, concurrency, benchmarking, latency, throughput]
