# Portfolio configuration: policies and the ordered project catalog.
# The catalog (ids and order) follows the owner's brief, section 5 (ADR-006).
# The planner refines each project's scope and milestones before it starts;
# changes are recorded in DECISIONS.md.

owner: miguelzzzzzzzz
workdir: /workspace/portfolio   # local checkouts live next to this repo

schedule:
  daily_cycle: "08:55 Asia/Manila"  # a Grok Bot routine runs the daily cycle every day

policies:
  max_active_projects: 1
  paid_api_budget_usd: 0          # no paid LLM/API spend without explicit user approval
  commit_style: conventional      # feat|fix|docs|test|eval|perf|refactor|ci|chore|build
  never_fabricate_metrics: true   # numbers only from executed, committed eval reports
  require_ci_green_before_next_milestone: true
  touch_only_portfolio_repos: true  # never modify pre-existing, unrelated repositories

quality:
  # Run by scripts/review_project.py --run-checks inside a project checkout.
  commands:
    - ruff check .
    - ruff format --check .
    - mypy
    - pytest -q -m "not slow"

projects:
  - id: production-rag-engine
    order: 1
    title: Production RAG Engine
    summary: >-
      Production-style RAG engine: structure-aware chunking, hybrid BM25 + vector
      retrieval, cross-encoder reranking, cited structured answers, FastAPI, and
      reproducible retrieval evals on SciFact.
    skills: [rag, embeddings, vector-search, bm25, reranking, evaluation, fastapi, docker, ci]
    milestones:
      - {id: M1, title: "Infrastructure, ingestion, configurable chunking"}
      - {id: M2, title: "Embeddings, vector store, BM25 index, retrieval interface"}
      - {id: M3, title: "Hybrid fusion, metadata filters, cross-encoder reranking"}
      - {id: M4, title: "Evaluation harness and benchmark reports"}
      - {id: M5, title: "Answer generation with citations and structured output"}
      - {id: M6, title: "FastAPI service, Dockerfile, image build in CI"}
      - {id: M7, title: "Hardening, documentation, v0.1.0 release"}

  - id: agentic-research-platform
    order: 2
    title: Agentic Research Platform
    summary: >-
      Hand-rolled tool-using research agent: planning, typed tool registry and
      routing, multi-step evidence gathering over the production-rag-engine
      retriever, budgets/timeouts/retries, guardrails, verified span citations,
      JSONL tracing, and programmatic trajectory evals with fault injection.
    skills: [agents, tool-calling, orchestration, guardrails, observability, evaluation, testing]
    staged_docs: /workspace/p02-agentic-research-platform  # repo created only after 01 completes
    milestones:
      - {id: M1, title: "Scaffold, tool contracts, registry, calculator, trace schema"}
      - {id: M2, title: "Agent loop, run state, budgets, timeouts/retries, scripted provider"}
      - {id: M3, title: "Research tools on the project-01 retriever, citations, guardrails"}
      - {id: M4, title: "Task suites, graders, eval runner, oracle and heuristic baselines"}
      - {id: M5, title: "OpenAI-compatible local-model provider, call parsing/repair, record/replay"}
      - {id: M6, title: "Fault injection, failure taxonomy, baselines and ablations"}
      - {id: M7, title: "Container, CI image smoke eval, docs, v0.1.0 release"}

  # Projects 03-10: ids and order are fixed by the brief. Summaries are working
  # descriptions; the planner aligns scope with brief section 5 before each start.
  - id: llm-evaluation-lab
    order: 3
    title: LLM Evaluation Lab
    summary: >-
      Evaluation and regression framework for LLM applications: versioned prompts,
      golden datasets, programmatic graders, LLM-judge agreement measurement,
      structured-output validity checks, and CI regression gates.
    skills: [llm-evaluation, prompt-engineering, structured-outputs, benchmarking, ci]

  - id: multimodal-document-intelligence
    order: 4
    title: Multimodal Document Intelligence
    summary: >-
      Extraction from PDFs, scans, and images using OCR, layout analysis, and
      vision-language models into validated schemas, with field-level accuracy
      evaluation.
    skills: [multimodal-ai, document-intelligence, ocr, structured-outputs, evaluation]

  - id: mlops-fraud-detection
    order: 5
    title: MLOps Fraud Detection
    summary: >-
      End-to-end fraud-detection ML system on imbalanced transaction data: feature
      pipeline, experiment tracking, model registry, served model API, and drift
      and performance monitoring.
    skills: [machine-learning, mlops, experiment-tracking, model-serving, monitoring, docker]

  - id: llm-finetuning-lab
    order: 6
    title: LLM Fine-Tuning Lab
    summary: >-
      Parameter-efficient fine-tuning (e.g. LoRA) of small open models with
      reproducible data preparation and training configs, evaluated against the
      base model.
    skills: [fine-tuning, deep-learning, peft, evaluation]

  - id: ai-observability-platform
    order: 7
    title: AI Observability Platform
    summary: >-
      Tracing, token/cost accounting, latency metrics, and quality signals for LLM
      applications, with dashboards and alerting.
    skills: [ai-observability, opentelemetry, cost-optimization, latency-optimization]

  - id: semantic-search-engine
    order: 8
    title: Semantic Search Engine
    summary: >-
      Semantic search service on a vector database: embedding pipeline, ANN
      indexing, filtering, reranking, and relevance/latency benchmarks.
    skills: [embeddings, vector-databases, semantic-search, reranking, benchmarking]

  - id: voice-ai-agent
    order: 9
    title: Voice AI Agent
    summary: >-
      Speech-in/speech-out agent: speech recognition, LLM tool calling, and speech
      synthesis, with end-to-end latency measurement.
    skills: [multimodal-ai, speech, agents, tool-calling, latency-optimization]

  - id: ai-inference-benchmark
    order: 10
    title: AI Inference Benchmark
    summary: >-
      Reproducible benchmarking of models, runtimes, and APIs on latency,
      throughput, quality, and cost.
    skills: [benchmarking, model-evaluation, latency-optimization, cost-optimization]
