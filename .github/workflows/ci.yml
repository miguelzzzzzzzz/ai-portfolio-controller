name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install pyyaml pytest ruff mypy types-PyYAML
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Validate state.json and portfolio.yaml
        run: python scripts/update_state.py show
      - run: pytest -q
